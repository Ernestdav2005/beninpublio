name: Deploy BeninPublio
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker before deployment
        run: node scripts/check-worker.mjs
      - name: Apply additive D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply beninpublio-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e2e1a28d5a083a30727716f1437e38c9
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e2e1a28d5a083a30727716f1437e38c9
